name: Windows
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4
      - uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: make mingw-w64-x86_64-gcc mingw-w64-x86_64-SDL2
      - name: Compilar
        run: make -C src tama
      - name: Empacotar
        run: |
          mkdir dist
          cp src/tama.exe dist/tamagotchi-p1.exe
          cp /mingw64/bin/SDL2.dll dist/
          cp LICENSE dist/
          printf 'Coloque a ROM do P1 (md5 3fce172403c27274e59723bbb9f6d8e9) em rom\\tama.b ou tama.b ao lado do .exe.\r\nTeclas: setas ou A S D; F = 10x.\r\n' > dist/LEIA-ME.txt
      - uses: actions/upload-artifact@v4
        with:
          name: tamagotchi-p1-windows
          path: dist
