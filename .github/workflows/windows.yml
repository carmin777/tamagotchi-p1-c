name: Windows
on: [push, workflow_dispatch]
permissions:
  contents: write
jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4
      - uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: make mingw-w64-x86_64-gcc mingw-w64-x86_64-SDL2
      - name: Build
        run: make -C src tama
      - name: Package
        run: |
          mkdir dist
          cp src/tama.exe dist/tamagotchi-p1.exe
          cp /mingw64/bin/SDL2.dll dist/
          cp LICENSE dist/
          printf '1. Open tamagotchi-p1.exe.\r\n2. On the first run, drag your ROM file (tama.b, md5 3fce172403c27274e59723bbb9f6d8e9) onto the window. It is remembered afterwards.\r\n(You can also drag tama.b onto the .exe.)\r\nKeys: arrows or A S D; F = 10x. The game saves on exit.\r\n' > dist/README.txt
      - uses: actions/upload-artifact@v4
        with:
          name: tamagotchi-p1-windows
          path: dist
      - name: Attach to the Release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          (cd dist && 7z a ../tamagotchi-p1-windows.zip . >/dev/null)
          gh release create "$GITHUB_REF_NAME" --prerelease --title "$GITHUB_REF_NAME" --notes-file RELEASE_NOTES.md || true
          gh release upload "$GITHUB_REF_NAME" tamagotchi-p1-windows.zip --clobber
